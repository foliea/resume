<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrien Folie - Resume</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1e1e1e;
            color: #eeeeee;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #000000;
            border-radius: 8px;
            border: 2px solid #9d7cd8;
            padding: 48px;
            max-width: 600px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 16px;
            border: 3px solid #56b6c2;
            overflow: hidden;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 32px;
            color: #eeeeee;
            margin-bottom: 8px;
        }
        .title {
            font-size: 18px;
            color: #7fd88f;
            margin-bottom: 4px;
        }
        .location {
            font-size: 14px;
            color: #eeeeee;
            margin-top: 8px;
        }
        .founder {
            font-size: 14px;
            margin-top: 8px;
        }
        .founder a {
            color: #56b6c2;
            text-decoration: none;
        }
        .founder a:hover {
            text-decoration: underline;
        }
        .section {
            margin-bottom: 32px;
        }
        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            color: #e5c07b;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            background: #1e1e1e;
            border-radius: 6px;
            text-decoration: none;
            color: #eeeeee;
            font-size: 16px;
            transition: all 0.2s;
        }
        .link:hover {
            background: #404040;
            border-color: #808080;
        }
        .link-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .link-text {
            flex: 1;
        }
        .link-desc {
            font-size: 12px;
            color: #a0a0a0;
            margin-top: 2px;
        }
        .divider {
            height: 1px;
            background: #808080;
            margin: 32px 0;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #808080;
            margin-top: 32px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="avatar">
                <img src="https://github.com/foliea.png" alt="Adrien Folie">
            </div>
            <h1>Adrien Folie</h1>
            <div class="title">Senior Software Engineer</div>
            <div class="founder">Founder, <a href="https://ripskore.com" target="_blank" rel="noopener noreferrer">Ripskore.com</a></div>
            <div class="location">Paris, France</div>
        </div>

        <div class="section">
            <div class="section-title">Resume</div>
            <div class="links">
                <a href="builds/resume.pdf" class="link">
                    <svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="#e06c75" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                        <div class="link-text">
                        <div>PDF</div>
                        <div class="link-desc">ATS-optimized, print-ready</div>
                    </div>
                </a>
                <a href="builds/resume.txt" class="link">
                    <svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="#c0c0c0" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                    <div class="link-text">
                        <div>Plain Text</div>
                        <div class="link-desc">ATS-compatible text format</div>
                    </div>
                </a>
            </div>
        </div>

        <div class="divider"></div>

        <div class="section">
            <div class="section-title">Profiles</div>
            <div class="links">
                <a href="https://linkedin.com/in/foliea" class="link" target="_blank" rel="noopener noreferrer">
                    <svg class="link-icon" viewBox="0 0 24 24" fill="#5c9cf5">

                    </svg>
                    <div class="link-text">
                        <div>LinkedIn</div>
                        <div class="link-desc">linkedin.com/in/foliea</div>
                    </div>
                </a>
                <a href="https://github.com/foliea" class="link" target="_blank" rel="noopener noreferrer">

                    </svg>
                    <div class="link-text">
                        <div>GitHub</div>
                        <div class="link-desc">github.com/foliea</div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
